[project]
name = "nba-projections"
version = "0.1.0"
description = "Estimate NBA player skill from noisy per-game stats and serve daily projections"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_projections"]